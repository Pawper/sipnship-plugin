# Nightly audit. It speaks only when something is wrong: an open issue with
# no State label, a PR merged in the last day whose issue is still open and
# still labeled ready, or a red-main issue nobody has closed. It leaves one
# comment on the tracking issue labeled "audit" and says nothing when clean.
# Where it runs: where the project's CI runs. RUNS_ON and RUN_SHELL are
# filled from .github/workflows/ci.yml by the bootstrap and the template
# sync, so a project with self-hosted runners spends no hosted minutes here;
# in a private repository every hosted job bills at least a minute, and
# these once used up one project's free allowance and stopped its deploys.
# Not a repository variable: on a Windows runner the shell must change with
# the runner (a bare "bash" there is the WSL stub), and GitHub reads
# "shell:" before any expression.
name: Audit

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: read
  actions: read
  # The audit's own log line goes to the service with the run's identity
  # token (#2319), no secret, the same road queue-drain.yml uses.
  id-token: write

jobs:
  audit:
    runs-on: RUNS_ON
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # The queue's own App (npx sipnship queue-identity) reads the runners;
      # without it the audit uses RUNNER_WATCH_TOKEN, as before.
      - name: Sign in as the queue
        id: app
        shell: RUN_SHELL
        env:
          QUEUE_APP_ID: ${{ secrets.QUEUE_APP_ID }}
          QUEUE_APP_KEY: ${{ secrets.QUEUE_APP_KEY }}
          GH_REPO: ${{ github.repository }}
        run: |
          if [ -f scripts/ci/queue-app-token.sh ]; then
            t=$(sh scripts/ci/queue-app-token.sh) || t=""
            if [ -n "$t" ]; then echo "::add-mask::$t"; echo "token=$t" >> "$GITHUB_OUTPUT"; fi
          fi
      - name: Find issues without a State and issues left stale by a merge
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          DEPLOY_INTERVAL_MINUTES: ${{ vars.DEPLOY_INTERVAL_MINUTES }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          ADMIN_TOKEN: ${{ steps.app.outputs.token || secrets.RUNNER_WATCH_TOKEN }}
          KEEP_RUNNER: ${{ vars.CI_KEEP_RUNNER }}
        shell: RUN_SHELL
        run: |
          . scripts/ci/lib.sh

          issues=$(gh issue list --state open --limit 500 --json number,labels \
            --jq '.[] | "\(.number) \([.labels[].name] | join(","))"')
          missing=$(issues_without_state "$issues")

          since=$(date -u -d '1 day ago' +%Y-%m-%d 2>/dev/null || date -u -v-1d +%Y-%m-%d)
          merged=$(gh pr list --state merged --search "merged:>=$since" --limit 100 --json number,body \
            --jq '.[] | "\(.number) \(.body | gsub("\n"; " "))"')
          stale=""
          printf '%s\n' "$merged" | while IFS= read -r line; do
            [ -n "$line" ] || continue
            pr=${line%% *}
            for n in $(closed_refs "$line"); do
              labels=$(gh issue view "$n" --json state,labels --jq 'select(.state == "OPEN") | [.labels[].name] | join(",")' 2>/dev/null || true)
              if [ "$(state_slug "$(state_label_in "$labels")")" = ready ]; then printf '%s %s\n' "$pr" "$n"; fi
            done
          done > stale.txt
          stale=$(cat stale.txt)

          red=$(gh issue list --label ci-red --state open --limit 20 --json number --jq '.[].number')

          # Branches left on the remote after their pull request ended. The
          # audit runs here and cannot see folders on anyone's machine, so
          # this is the half of the worktree check it can do; the session
          # brief and scripts/worktrees.sh audit do the local half.
          ended=$(gh pr list --state closed --limit 300 --json headRefName --jq '.[].headRefName' | sort -u)
          remote=$(git ls-remote --heads origin | sed 's#.*refs/heads/##')
          branches=$(ended_remote_branches "$remote" "$ended" "${{ github.event.repository.default_branch }}")

          # Deploys: the scheduled path's last run and recorded commit, or,
          # for the guard path, the commit Vercel reports in production.
          deploy=""
          if [ -f .claude/deploy.json ] && [ -f scripts/ci/deploy-health.sh ]; then
            . scripts/ci/deploy-lib.sh
            target=$(deploy_target "$(cat .claude/deploy.json)")
            last=$(gh run list --workflow deploy.yml --limit 1 --json databaseId,conclusion --jq '.[0] | "\(.databaseId) \(.conclusion // "")"' 2>/dev/null || true)
            last_run=${last#* }
            # The build-on-runner job and the Vercel API exist only for a
            # Vercel project; any other target skips both.
            if [ "$target" = vercel ] && [ "$last_run" = success ] && [ -n "${last%% *}" ]; then
              fell=$(gh run view "${last%% *}" --json jobs --jq '[.jobs[] | select(.name == "build-on-runner" and .conclusion == "failure")] | length' 2>/dev/null || echo 0)
              [ "${fell:-0}" = 0 ] || last_run=fellback
            fi
            in_prod=""
            if [ "$target" = vercel ] && grep -q '"guard"' .claude/deploy.json && [ -n "$VERCEL_TOKEN" ] && [ -n "$VERCEL_PROJECT_ID" ]; then
              in_prod=$(curl -s -H "Authorization: Bearer $VERCEL_TOKEN" "https://api.vercel.com/v6/deployments?projectId=$VERCEL_PROJECT_ID&teamId=$VERCEL_ORG_ID&target=production&state=READY&limit=1" \
                | sed -n 's/.*"githubCommitSha":"\([0-9a-f]*\)".*/\1/p' | head -n 1)
            fi
            deploy=$(sh scripts/ci/deploy-health.sh "$in_prod" "$last_run")
          fi

          # Serial merges: more than two within an hour means pull requests
          # that were ready together landed alone, each with its own CI run
          # and deploy. The queue writes the reason into the merge title.
          serial=""
          if [ -f scripts/ci/batch-lib.sh ]; then
            . scripts/ci/batch-lib.sh
            serial=$(serial_bursts "$(git log --first-parent --since='1 day ago' --format='%ct%x09%s' "origin/${{ github.event.repository.default_branch }}" 2>/dev/null)")
          fi

          # A workflow that passed before its last change and fails since.
          breaks=""
          if [ -f scripts/ci/workflow-breaks.sh ]; then
            breaks=$(sh scripts/ci/workflow-breaks.sh "${{ github.event.repository.default_branch }}" | sed 's/^/- /')
          fi

          # The scheduled queue drain fired late or skipped by GitHub.
          late=""
          if [ -f scripts/ci/drain-late.sh ]; then
            late=$(sh scripts/ci/drain-late.sh | sed 's/^/- /')
          fi

          # Runners, once a night, from a runner: this replaced the hourly
          # hosted Runner watch, which in a private repository whose hosted
          # minutes are used up failed at every schedule. A run queued over
          # ten minutes, a runner offline (needs RUNNER_WATCH_TOKEN, with
          # Administration: read), and hosted runs GitHub would not start.
          runner=""
          if [ -f scripts/ci/run-lib.sh ]; then
            . scripts/ci/run-lib.sh
            runs=$(gh api "repos/$GH_REPO/actions/runs?per_page=50" \
              --jq '.workflow_runs[] | [.id, .name, .head_branch, .status, (.created_at | fromdate)] | @tsv' 2>/dev/null || true)
            stuck=$(stuck_runs "$runs" "$(date +%s)" 10)
            if [ -n "$stuck" ]; then
              runner=$(printf 'Runs queued for more than ten minutes, which usually means no runner is picking them up:\n%s' \
                "$(printf '%s\n' "$stuck" | awk -F'\t' '{ printf "- %s on %s, queued %s minutes (run %s)\n", $2, $3, $4, $1 }')")
            fi
            if [ -n "$ADMIN_TOKEN" ]; then
              problems=$(runner_problems "$(GH_TOKEN="$ADMIN_TOKEN" gh api "repos/$GH_REPO/actions/runners" \
                --jq '.runners[] | [.name, .status, (.busy | tostring)] | @tsv' 2>/dev/null || true)")
              if [ -n "$problems" ]; then runner=$(printf '%s\n\n%s' "$runner" "$problems" | sed '/./,$!d'); fi
              # A queued Queue drain whose own runs-on label matches no registered runner: a
              # QUEUE_RUNS_ON written as a list can name a machine nobody has (#2817).
              if [ -f scripts/ci/drain-unmatched-lib.sh ]; then
                . scripts/ci/drain-unmatched-lib.sh
                drain_runs=$(printf '%s\n' "$runs" | awk -F'\t' '$2 == "Queue drain" && ($4 == "queued" || $4 == "waiting" || $4 == "requested") { print $1 }')
                if [ -n "$drain_runs" ]; then
                  runner_labels=$(GH_TOKEN="$ADMIN_TOKEN" gh api "repos/$GH_REPO/actions/runners" --jq '[.runners[].labels[].name] | join(",")' 2>/dev/null || true)
                  for dr in $drain_runs; do
                    job_labels=$(gh api "repos/$GH_REPO/actions/runs/$dr/jobs" --jq '[.jobs[0].labels[]] | join(",")' 2>/dev/null || true)
                    drain_unmatched=$(drain_unmatched_label "$job_labels" "$runner_labels")
                    if [ -n "$drain_unmatched" ]; then runner=$(printf '%s\n\n- %s' "$runner" "$(drain_unmatched_line "$drain_unmatched")" | sed '/./,$!d'); break; fi
                  done
                fi
              fi
            fi
            # One runner kept for the batch and main, where ci.yml keeps one:
            # the merge queue sets the labels; say when it cannot, or when
            # none is kept or none carries the label.
            if grep -q 'vars.CI_KEEP_RUNNER' .github/workflows/ci.yml 2>/dev/null && [ -f scripts/ci/batch-lib.sh ]; then
              . scripts/ci/batch-lib.sh
              kept=""
              [ "$KEEP_RUNNER" != off ] || kept="The merge queue's token cannot manage this repository's runners, so no runner is kept for the batch and main and pull requests take any runner; give the queue's token Administration: write."
              if [ -z "$kept" ] && [ -n "$ADMIN_TOKEN" ]; then
                kept=$(runner_label_problem "$(GH_TOKEN="$ADMIN_TOKEN" gh api "repos/$GH_REPO/actions/runners" \
                  --jq '.runners[] | [.id, .name, .status, ([.labels[].name] | join(","))] | @tsv' 2>/dev/null || true)")
              fi
              if [ -n "$kept" ]; then runner=$(printf '%s\n\n- %s' "$runner" "$kept" | sed '/./,$!d'); fi
            fi
            failed=$(gh api "repos/$GH_REPO/actions/runs?status=failure&per_page=5" --jq '.workflow_runs[].check_suite_id' 2>/dev/null || true)
            notes=""
            for cs in $failed; do
              for cr in $(gh api "repos/$GH_REPO/check-suites/$cs/check-runs" --jq '.check_runs[0].id' 2>/dev/null); do
                notes="$notes$(gh api "repos/$GH_REPO/check-runs/$cr/annotations" --jq '.[].message' 2>/dev/null || true)
          "
              done
            done
            quota=$(quota_gone "$notes")
            if [ -n "$quota" ]; then runner=$(printf '%s\n\n- %s' "$runner" "$quota" | sed '/./,$!d'); fi
          fi

          # What the runner's machine is quietly collecting: a Temp folder that
          # only grows, kernel memory held for its files, and shells left running
          # for more than a day.
          hygiene=""
          if [ -f scripts/ci/machine-upkeep.sh ]; then
            hygiene=$(sh scripts/ci/machine-upkeep.sh | sed 's/^/- /')
          fi

          # A scheduled gate on main that failed before its test jobs existed:
          # GitHub shows no failed step and the red-main job needs the test
          # jobs, so nothing else says it. Twice in a row opens (or adds to)
          # the red-main issue.
          gate=""
          if [ -f scripts/ci/gate.sh ]; then
            gate=$(sh scripts/ci/gate.sh early-red | sed 's/^/- /')
            if [ -n "$gate" ] && [ "$(sh scripts/ci/gate.sh early-red-count)" -ge 2 ]; then
              open=$(gh api "repos/$GH_REPO/issues?labels=ci-red&state=open&per_page=1" --jq '.[0].number // ""')
              if [ -z "$open" ]; then
                gh issue create --title "main is red" --label "ci-red,state:ready" \
                  --body "Main's gate ended red before its tests started twice in a row, so nothing has checked main. Read the last scheduled runs of the CI workflow." >/dev/null
              else
                gh api "repos/$GH_REPO/issues/$open/comments" -f body="Main's gate again ended red before its tests started." >/dev/null
              fi
            fi
          fi

          # An issue waits on you only with an ask you can answer: the hook refuses it in
          # a session; this names any that reached the owner another way.
          asks=""
          if [ -f scripts/ci/ask-audit.sh ]; then
            asks=$(sh scripts/ci/ask-audit.sh | sed 's/^/- /')
            [ -z "$asks" ] || asks=$(printf 'Issues waiting on you with no question on them, or one you could not answer as written:\n%s' "$asks")
          fi

          # A job with no line in .github/jobs.txt shows on the dashboard as a check
          # its workflow does not explain; this names each one.
          jobs=""
          if [ -f scripts/ci/jobs-audit.sh ]; then
            jobs=$(sh scripts/ci/jobs-audit.sh | sed "s/^/- /")
            [ -z "$jobs" ] || jobs=$(printf "Jobs with no line in .github/jobs.txt saying what they are for:\n%s" "$jobs")
          fi

          # An issue is In progress only while something is working on it: one
          # quiet for two hours with no open pull request is stuck, whatever
          # missed the event that should have put it back to Ready.
          idle=""
          if [ -f scripts/ci/in-progress-audit.sh ]; then
            idle=$(sh scripts/ci/in-progress-audit.sh | sed 's/^/- /')
            [ -z "$idle" ] || idle=$(printf 'Issues In progress with nothing working on them:\n%s' "$idle")
          fi

          # The drive's plan publishes its proposed round every time it looks: one over an hour
          # old while ready work waits is a missed publish, said here.
          looks=""
          if [ -f scripts/ci/proposal-audit.sh ]; then
            looks=$(sh scripts/ci/proposal-audit.sh | sed 's/^/- /')
          fi

          # A change whose issue waits on the owner is the owner's read; without queue:hold the
          # queue could merge it unread, and the drive would count it as a running round.
          unheld=""
          if [ -f scripts/ci/waiting-hold-audit.sh ]; then
            unheld=$(sh scripts/ci/waiting-hold-audit.sh | sed 's/^/- /')
            [ -z "$unheld" ] || unheld=$(printf 'Pull requests whose issue waits on you, with no hold:\n%s' "$unheld")
          fi

          # A held change's question lives as a comment on the issue it closes (spec 024): one
          # that closes none has nowhere for its question to live, and two that close the same
          # issue leave the second usually replacing the first.
          heldissue=""
          if [ -f scripts/ci/held-change-audit.sh ]; then
            heldissue=$(sh scripts/ci/held-change-audit.sh | sed 's/^/- /')
            [ -z "$heldissue" ] || heldissue=$(printf 'Held changes with nowhere for their question to live:\n%s' "$heldissue")
          fi

          # A green change that is not held and has not landed in half an hour: the queue lands one
          # within minutes, so a drain missed it and nothing retried (#2398).
          greenstuck=""
          if [ -f scripts/ci/green-stuck-audit.sh ]; then
            greenstuck=$(sh scripts/ci/green-stuck-audit.sh | sed 's/^/- /')
            [ -z "$greenstuck" ] || greenstuck=$(printf 'Green changes that did not land:\n%s' "$greenstuck")
          fi

          # A closed issue that still carries a State: closing takes the label off in the
          # same step, so one left with it is a close that missed, and the drive reads it
          # as work outstanding.
          closedstate=""
          if [ -f scripts/ci/closed-state-audit.sh ]; then
            closedstate=$(sh scripts/ci/closed-state-audit.sh | sed 's/^/- /')
            [ -z "$closedstate" ] || closedstate=$(printf 'Closed issues that still carry a State label:\n%s' "$closedstate")
          fi

          # Open issues whose every "What done looks like" line is built: the drive closes them (#2616).
          builtall=""
          if [ -f scripts/ci/built-audit.sh ]; then
            builtall=$(sh scripts/ci/built-audit.sh | sed 's/^/- /')
            [ -z "$builtall" ] || builtall=$(printf 'Open issues with every line built:\n%s' "$builtall")
          fi

          # An open change the closes check would fail: it fails the moment someone
          # approves it, and looks approved and stuck. Named a night early instead.
          closescheck=""
          if [ -f scripts/ci/closes-check-audit.sh ]; then
            closescheck=$(sh scripts/ci/closes-check-audit.sh | sed 's/^/- /')
            [ -z "$closescheck" ] || closescheck=$(printf 'Open pull requests the closes check would fail:\n%s' "$closescheck")
          fi

          # The hours the REST budget reached zero in the last day, and who could have spent it (#2607).
          restzero=""
          if [ -f scripts/ci/rest-zero-audit.sh ]; then restzero=$(sh scripts/ci/rest-zero-audit.sh | sed "s/^/- /"); fi

          # A landing in the last day whose files called for a test part
          # (own_run_decide or full_run_decide) that did not pass on its
          # head commit: "green" with a needed part skipped is not green.
          skipped=""
          if [ -f scripts/ci/skipped-parts-audit.sh ]; then
            skipped=$(sh scripts/ci/skipped-parts-audit.sh "$since" | sed 's/^/- /')
            [ -z "$skipped" ] || skipped=$(printf 'Pull requests landed in the last day that skipped a test part their files called for:\n%s' "$skipped")
          fi

          # Tests that flaked more than once in the last week: a red main the very next run cleared with no fix.
          flaky=""
          if [ -f scripts/ci/flaky-audit.sh ]; then
            flaky=$(sh scripts/ci/flaky-audit.sh | sed 's/^/- /')
            [ -z "$flaky" ] || flaky=$(printf 'Tests that flaked more than once in the last week:\n%s' "$flaky")
          fi

          body=$(audit_comment "$missing" "$stale" "$red" "$branches")
          if [ -n "$flaky" ]; then body=$(printf '%s\n\n%s' "$body" "$flaky" | sed '/./,$!d'); fi
          if [ -n "$skipped" ]; then body=$(printf '%s\n\n%s' "$body" "$skipped" | sed '/./,$!d'); fi
          if [ -n "$closedstate" ]; then body=$(printf '%s\n\n%s' "$body" "$closedstate" | sed '/./,$!d'); fi
          if [ -n "$closescheck" ]; then body=$(printf '%s\n\n%s' "$body" "$closescheck" | sed '/./,$!d'); fi
          if [ -n "$builtall" ]; then body=$(printf '%s\n\n%s' "$body" "$builtall" | sed '/./,$!d'); fi
          if [ -n "$unheld" ]; then body=$(printf '%s\n\n%s' "$body" "$unheld" | sed '/./,$!d'); fi
          if [ -n "$heldissue" ]; then body=$(printf '%s\n\n%s' "$body" "$heldissue" | sed '/./,$!d'); fi
          if [ -n "$greenstuck" ]; then body=$(printf '%s\n\n%s' "$body" "$greenstuck" | sed '/./,$!d'); fi
          if [ -n "$restzero" ]; then body=$(printf "%s\n\n%s" "$body" "$restzero" | sed "/./,\$!d"); fi
          # The installed plugin copy more than an hour behind the published one, which each round's first step should have updated.
          installed=""
          if [ -f scripts/ci/installed-copy-audit.sh ]; then installed=$(sh scripts/ci/installed-copy-audit.sh); fi
          if [ -n "$installed" ]; then body=$(printf '%s\n\n%s' "$body" "$installed" | sed '/./,$!d'); fi
          if [ -n "$idle" ]; then body=$(printf '%s\n\n%s' "$body" "$idle" | sed '/./,$!d'); fi
          if [ -n "$looks" ]; then body=$(printf '%s\n\n%s' "$body" "$looks" | sed '/./,$!d'); fi
          if [ -n "$asks" ]; then body=$(printf '%s\n\n%s' "$body" "$asks" | sed '/./,$!d'); fi
          if [ -n "$jobs" ]; then body=$(printf "%s\n\n%s" "$body" "$jobs" | sed "/./,\$!d"); fi
          if [ -n "$runner" ]; then body=$(printf '%s\n\n%s' "$body" "$runner" | sed '/./,$!d'); fi
          if [ -n "$serial" ]; then body=$(printf '%s\n\n- %s' "$body" "$serial" | sed '/./,$!d'); fi
          if [ -n "$deploy" ]; then body=$(printf '%s\n\n- %s' "$body" "$deploy" | sed '/./,$!d'); fi
          if [ -n "$breaks" ]; then body=$(printf '%s\n\n%s' "$body" "$breaks" | sed '/./,$!d'); fi
          if [ -n "$late" ]; then body=$(printf '%s\n\n%s' "$body" "$late" | sed '/./,$!d'); fi
          if [ -n "$gate" ]; then body=$(printf "%s\n\n%s" "$body" "$gate" | sed "/./,\$!d"); fi
          if [ -n "$hygiene" ]; then body=$(printf '%s\n\n%s' "$body" "$hygiene" | sed '/./,$!d'); fi
          if [ -z "$body" ]; then
            echo "Clean. Nothing to say."
            exit 0
          fi
          tracking=$(gh issue list --label audit --state open --limit 1 --json number --jq '.[0].number')
          if [ -z "$tracking" ]; then
            tracking=$(gh issue create --title "Audit" --label "audit,$(state_label parked "$(project_label_form)")" \
              --body "The nightly audit comments here when something is wrong. It says nothing when all is clean." | sed 's#.*/##')
          fi
          # Through the service as the app where this project is connected,
          # so the builder is not the audit's standing issue's own author
          # (#2319); the one gh call as before when it is not, or the
          # service does not take it.
          audit_file=$(mktemp 2>/dev/null || echo "$RUNNER_TEMP/audit-comment.md")
          printf '%s\n' "$body" > "$audit_file"
          if [ -f scripts/ci/log-post-lib.sh ]; then . scripts/ci/log-post-lib.sh && log_post audit "$tracking" "$audit_file" >/dev/null; else gh issue comment "$tracking" --body "$body"; fi
          rm -f "$audit_file" 2>/dev/null || true
          echo "Commented on issue $tracking."

      # A failed audit must reach someone: the audit is what reports drift,
      # so while it is red those reports are not arriving. This comments on
      # the issue labeled "audit" (or opens it) with the run to read.
      - name: Say the audit failed
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: RUN_SHELL
        run: |
          . scripts/ci/lib.sh
          note="The nightly audit failed, so its reports of drift, offline runners and stale issues did not arrive tonight. Read the failed step: $RUN_URL"
          tracking=$(gh issue list --label audit --state open --limit 1 --json number --jq '.[0].number')
          if [ -z "$tracking" ]; then
            tracking=$(gh issue create --title "Audit" --label "audit,$(state_label parked "$(project_label_form)")" \
              --body "The nightly audit comments here when something is wrong. It says nothing when all is clean." | sed 's#.*/##')
          fi
          note_file=$(mktemp 2>/dev/null || echo "$RUNNER_TEMP/audit-failed.md")
          printf '%s\n' "$note" > "$note_file"
          if [ -f scripts/ci/log-post-lib.sh ]; then . scripts/ci/log-post-lib.sh && log_post audit "$tracking" "$note_file" >/dev/null; else gh issue comment "$tracking" --body "$note"; fi
          rm -f "$note_file" 2>/dev/null || true
