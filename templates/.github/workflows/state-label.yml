# Keeps the state label on an issue in step with the State field from the
# task template, so the board and the audits can trust the label.
# Where it runs: where the project's CI runs. RUNS_ON and RUN_SHELL are
# filled from .github/workflows/ci.yml by the bootstrap and the template
# sync, so a project with self-hosted runners spends no hosted minutes here;
# in a private repository every hosted job bills at least a minute, and
# these once used up one project's free allowance and stopped its deploys.
# Not a repository variable: on a Windows runner the shell must change with
# the runner (a bare "bash" there is the WSL stub), and GitHub reads
# "shell:" before any expression.
name: State label

on:
  issues:
    types: [opened, edited]

# "contents: read" is for the checkout; a permissions block that names
# only issues takes contents away, and the checkout fails with
# "repository not found".
permissions:
  contents: read
  issues: write

# One run per issue per burst: a run started by a later edit of the same
# issue cancels the earlier one, so ten label changes are one run.
concurrency:
  group: state-label-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  label:
    runs-on: RUNS_ON
    steps:
      - uses: actions/checkout@v4
      - name: Set the state label from the State field
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BODY: ${{ github.event.issue.body }}
          NUMBER: ${{ github.event.issue.number }}
        shell: RUN_SHELL
        run: |
          . scripts/ci/lib.sh
          # The project's own label form: "state:ready" or "state: ready".
          LABEL_FORM=$(project_label_form)
          label=$(state_label_from_body "$BODY" "$LABEL_FORM")
          if [ -z "$label" ]; then
            echo "No State field in the body; leaving labels as they are."
            exit 0
          fi
          # One REST call sets the labels: the others kept, every state
          # label of either form dropped, this one added.
          cur=$(gh api "repos/$GH_REPO/issues/$NUMBER/labels" --jq '.[].name')
          state_labels_json "$cur" "$label" | gh api -X PUT "repos/$GH_REPO/issues/$NUMBER/labels" --input - > /dev/null
          echo "Set $label"
