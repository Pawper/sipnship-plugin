# CI skeleton. Three runner jobs on a pull request: "checks" (every cheap
# rule, as steps after one checkout), "app" (one install, then the
# type-check, the tests and the build, only when the change touches the
# app) and "CI passed". Main gets no run per landing: each landing's own
# green pull-request run, on the merged head, is its record. Once an hour a
# scheduled run's "gate" job runs every test part of every class, but only
# when main moved since the last gate and has been quiet for
# GATE_QUIET_MINUTES, and opens the red-main issue when that fails. There
# are no path filters on the
# workflow itself: every update to a PR starts a run, so the merge queue
# never waits on a run that was skipped.
#
# Why so few jobs: on self-hosted runners each job pays for a pickup, a
# checkout and a setup, which cost more than a 2-second script. Ten small
# jobs on two runners spent ten minutes queued for two minutes of work. A
# new rule is a step in "checks", not a job of its own.
#
# Replace each "echo" step with the project's real command, and never run
# one command twice: a step that repeats one above is a runner minute paid
# for nothing.
#
# RUNS_ON is the runner label for every job here. ubuntu-latest for hosted
# runners; [self-hosted, windows] for a studio's own machines. The gh-only
# workflows (audit, board sync, state label, runner watch) stay hosted;
# they need no code.
name: CI

on:
  pull_request:
  # Main's full gate: hourly, on the same runners as everything else.
  schedule:
    - cron: '0 * * * *'
  # By hand, the gate runs whatever the quiet time.
  workflow_dispatch:

env:
  # How long main must go without a landing before the gate runs on it.
  GATE_QUIET_MINUTES: 60

permissions:
  contents: read
  issues: write
  # read a pull request's live body: a re-run keeps the payload of the run
  # it re-runs, so an edited body would otherwise need an empty commit
  pull-requests: read

# A new push to a pull request cancels its older run, which would
# otherwise hold a runner for a commit nobody will merge. Gate runs share
# one group and wait for each other, so a gate is never cut short.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'gate' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# RUN_SHELL is the shell every step here runs in. On hosted runners it is
# "bash". On a Windows self-hosted runner it must be Git's bash by its
# short path, because "bash" and "sh" on the runner's service account
# resolve to the WSL stub and every step fails:
#   'C:\PROGRA~1\Git\bin\bash.exe --noprofile --norc -eo pipefail {0}'
# Keep it at the workflow level; a step-level shell cannot use expressions.
defaults:
  run:
    shell: RUN_SHELL

jobs:
  gate:
    # Main's full gate, on a scheduled or by-hand run only: decides in
    # seconds whether every test part runs (gate.sh, gate-lib.sh). The
    # last gated head is read from GitHub, never kept in a file.
    if: github.event_name != 'pull_request'
    runs-on: RUNS_ON
    permissions:
      contents: read
      actions: read
    outputs:
      parts: ${{ steps.decide.outputs.parts }}
    steps:
      - uses: actions/checkout@v4
      - id: decide
        name: Decide whether main is due its gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          why=$(sh scripts/ci/gate.sh decide "${{ github.event_name }}")
          echo "$why"
          if [ "$why" = run ]; then parts=$(sh scripts/ci/test-parts.sh matrix all); else parts='[]'; fi
          echo "parts=$parts" >> "$GITHUB_OUTPUT"
          echo "Test parts: $parts"

  checks:
    # Every cheap rule, one checkout. Each step names the rule it enforces;
    # the step that failed is the rule that was broken. Pull requests only.
    if: github.event_name == 'pull_request'
    runs-on: RUNS_ON
    permissions:
      # The workflow's own, plus actions: read so a failure can name its step.
      contents: read
      issues: write
      pull-requests: read
      actions: read
    outputs:
      classes: ${{ steps.classes.outputs.classes }}
      parts: ${{ steps.classes.outputs.parts }}
    env:
      # On a pull request github.sha is the merge of the branch into main as
      # it is now, and its first parent is that main. The recorded base.sha
      # is main as it was at the pull request's last event, so a line that
      # landed on main in between once counted as the pull request's own.
      BASE: ${{ github.event_name == 'pull_request' && 'HEAD^1' || github.event.before }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: classes
        name: Classify the change
        run: |
          base="$BASE"
          case "$base" in ""|0000000000000000000000000000000000000000) base="${{ github.sha }}~1" ;; esac
          classes=$(sh scripts/ci/classify.sh "$base" "${{ github.sha }}")
          echo "classes=$classes" >> "$GITHUB_OUTPUT"
          echo "Classes: $classes"
          # The test parts of those classes (the "!parts" lines of
          # classes.txt), as the "tests" job's matrix; [] when none.
          parts=$(sh scripts/ci/test-parts.sh matrix "$classes")
          echo "parts=$parts" >> "$GITHUB_OUTPUT"
          echo "Test parts: $parts"
      - name: Fail when a text file has CRLF endings
        # Every pull request: mixed endings make every diff a conflict.
        run: sh scripts/ci/line-endings.sh
      - name: Fail when STATUS.md is stale
        # Every pull request: the page must never go stale.
        run: sh status/check.sh
      - name: Fail on a reused number or a running task number
        # Two numbered files with one number, or a task with a running
        # number instead of its issue number; a batch that merged two
        # migrations each called 0022 fails before main.
        if: github.event_name == 'pull_request'
        run: sh scripts/ci/numbering-check.sh "$BASE" "${{ github.sha }}"
      - name: Fail when src/ changed without naming or changing its spec
        # A change to src/ belongs to a spec: the pull request names it in
        # its body ("Spec: specs/<feature>") or, when the design changed,
        # changes the feature's folder.
        if: github.event_name == 'pull_request' && (contains(steps.classes.outputs.classes, 'app') || contains(steps.classes.outputs.classes, 'other'))
        env:
          GH_TOKEN: ${{ github.token }}
          PAYLOAD_TEXT: |
            ${{ github.event.pull_request.title }}
            ${{ github.event.pull_request.body }}
        run: |
          # The live title and body, so a re-run sees an edited body; the
          # event's copy when GitHub cannot be read.
          SPEC_TEXT=$(gh api "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}" --jq '.title + "\n" + (.body // "")' 2>/dev/null) || SPEC_TEXT=$PAYLOAD_TEXT
          export SPEC_TEXT
          sh scripts/ci/spec-check.sh "$BASE" "${{ github.sha }}"
      - name: Fail when a setup file changed without SETUP.md
        if: github.event_name == 'pull_request'
        run: sh scripts/ci/setup-check.sh "$BASE" "${{ github.sha }}"
      - name: Fail when shared code is changed together with other work
        # Passes when the list of shared paths is empty.
        if: github.event_name == 'pull_request'
        run: sh scripts/ci/shared-check.sh "$BASE" "${{ github.sha }}"
      - name: Fail when a file is deleted without a stated reason
        # Never delete; move aside. A pull request that must delete says why
        # in its body: "Deletes: <reason>".
        if: github.event_name == 'pull_request'
        env:
          PAYLOAD_BODY: ${{ github.event.pull_request.body }}
          GH_TOKEN: ${{ github.token }}
        run: |
          PR_BODY=$(gh api "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}" --jq '.body // ""' 2>/dev/null) || PR_BODY=$PAYLOAD_BODY
          export PR_BODY
          sh scripts/ci/delete-check.sh "$BASE" "${{ github.sha }}"
      - name: Fail when a client file hands process.env to anything whole
        if: github.event_name == 'pull_request' && (contains(steps.classes.outputs.classes, 'app') || contains(steps.classes.outputs.classes, 'other'))
        run: sh scripts/ci/client-env-check.sh
      - name: Fail when a screen gains a literal colour, size or font, or the design files are stale
        # Only in a project with design/tokens.json: the generated design
        # tables are current, no UI file added a raw value, and each screen
        # pair the change touches names the same type roles on both sides.
        if: github.event_name == 'pull_request' && hashFiles('design/tokens.json') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SPEC_TEXT=$(gh api "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}" --jq '.title + "\n" + (.body // "")' 2>/dev/null) || SPEC_TEXT="${{ github.event.pull_request.title }}"
          export SPEC_TEXT
          sh scripts/ci/design-check.sh "$BASE" "${{ github.sha }}"
      - name: Fail when a screen changes and its mock does not
        # Only in a project with scripts/ci/mocks.txt: a mapped UI file that
        # changes has its mock (or its generator) change too, or the body
        # says "Mock: unchanged, <reason>"; a new UI file beside mocked
        # screens is mapped or declared unmocked.
        if: github.event_name == 'pull_request' && hashFiles('scripts/ci/mocks.txt') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SPEC_TEXT=$(gh api "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}" --jq '.title + "\n" + (.body // "")' 2>/dev/null) || SPEC_TEXT="${{ github.event.pull_request.title }}"
          export SPEC_TEXT
          sh scripts/ci/mock-check.sh "$BASE" "${{ github.sha }}"
      # A project with data or docs checks of its own adds them here as
      # steps, with "if: contains(steps.classes.outputs.classes, 'data')"
      # (or 'docs'). Never repeat a step above.
      - name: Say what failed
        # A summary and an annotation naming the failed step and its last
        # lines. Never cancels the run, which would mark this job cancelled
        # and hide the failure; GitHub has no call to cancel one other job.
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: sh scripts/ci/failure-report.sh job

  app:
    # One install, then everything that needs it. The production build runs
    # here on every pull request that touches the app: agents never build
    # inside a worktree, so without it nobody builds before merging, and
    # tests and the type-check once passed on a client bug only the build
    # would show.
    needs: checks
    if: github.event_name == 'pull_request' && (contains(needs.checks.outputs.classes, 'app') || contains(needs.checks.outputs.classes, 'tests') || contains(needs.checks.outputs.classes, 'other'))
    runs-on: RUNS_ON
    permissions:
      # The workflow's own, plus actions: read so a failure can name its step.
      contents: read
      issues: write
      pull-requests: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - name: Install once
        run: echo "replace with the install, for example npm ci in the app's folder"
      - name: Type-check
        run: echo "replace with the type-check, for example npx tsc --noEmit"
      - name: Tests for this class
        # When this gets slow, shard it: add "strategy: matrix: shard: [1, 2, 3, 4]"
        # to this job and pass the shard to the runner, for example
        # "pytest --splits 4 --group ${{ matrix.shard }}" or "vitest run --shard=N/4".
        run: echo "replace with the app tests"
      - name: The production build
        if: contains(needs.checks.outputs.classes, 'app') || contains(needs.checks.outputs.classes, 'other')
        run: echo "replace with BUILD_COMMAND"
      - name: Say what failed
        # A summary and an annotation naming the failed step and its last
        # lines. Never cancels the run, which would mark this job cancelled
        # and hide the failure; GitHub has no call to cancel one other job.
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: sh scripts/ci/failure-report.sh job

  tests:
    # One entry per test part, from the "!parts" lines of
    # scripts/ci/classes.txt, side by side: on a pull request the parts of
    # the classes the change touched, and the first red part cancels the
    # rest; in main's gate every part of every class, each to the end.
    # Skipped when there are no parts. The name is plain, never an
    # expression: a skipped matrix job has no matrix values to fill one in.
    needs: [gate, checks]
    if: ${{ !cancelled() && (needs.checks.outputs.parts || needs.gate.outputs.parts || '[]') != '[]' }}
    strategy:
      fail-fast: ${{ github.event_name == 'pull_request' }}
      matrix:
        part: ${{ fromJSON(needs.checks.outputs.parts || needs.gate.outputs.parts || '[]') }}
    name: tests
    runs-on: RUNS_ON
    permissions:
      # The workflow's own, plus actions: read so a failure can name its step.
      contents: read
      issues: write
      pull-requests: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - name: Run the ${{ matrix.part }} part
        env:
          # Main's gate goes to the end of each part.
          CI_FULL_RUN: ${{ github.event_name != 'pull_request' && 'yes' || '' }}
        run: sh scripts/ci/test-parts.sh run "${{ matrix.part }}" 2>&1 | tee "$RUNNER_TEMP/part.log"
      - name: Say what failed
        # A summary and an annotation naming the failed step and its last
        # lines. Never cancels the run, which would mark this job cancelled
        # and hide the failure; GitHub has no call to cancel one other job.
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: sh scripts/ci/failure-report.sh job "$RUNNER_TEMP/part.log"

  screens:
    # Each touched screen beside its mock: only on a pull request that
    # changes a UI file mapped in scripts/ci/mocks.txt on a line with an
    # @/route, and only once scripts/design/serve.sh is filled in. One
    # browser render per screen, light and dark; the images go up as an
    # artifact, the table to the job summary and to one comment on the pull
    # request, edited in place. A share of differing pixels above the
    # threshold is flagged and never fails the job; it fails only when a
    # screen cannot be rendered. It records nothing: a person runs
    # "sh scripts/design/screens.sh compare --mock NAME" after looking.
    needs: checks
    if: github.event_name == 'pull_request' && (contains(needs.checks.outputs.classes, 'app') || contains(needs.checks.outputs.classes, 'other'))
    runs-on: RUNS_ON
    permissions:
      # The workflow's own, plus actions: read so a failure can name its step.
      contents: read
      issues: write
      pull-requests: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: run
        name: Render each touched screen beside its mock
        run: |
          out="$RUNNER_TEMP/screens"
          echo "out=$out" >> "$GITHUB_OUTPUT"
          if [ ! -f scripts/ci/mocks.txt ] || [ ! -f scripts/design/serve.sh ] || ! grep -q '@/' scripts/ci/mocks.txt; then
            echo "No screen has a route and a server yet; nothing to render."; exit 0
          fi
          code=0
          sh scripts/design/screens-run.sh HEAD^1 "${{ github.sha }}" "$out" || code=$?
          [ ! -f "$out/table.md" ] || echo "rendered=yes" >> "$GITHUB_OUTPUT"
          exit "$code"
      - id: upload
        name: Upload the side-by-side images
        if: always() && steps.run.outputs.rendered == 'yes'
        uses: actions/upload-artifact@v4
        with:
          name: screens-side-by-side
          path: ${{ steps.run.outputs.out }}/*.png
          retention-days: 14
      - name: Write the table to the summary and the pull request
        if: always() && steps.run.outputs.rendered == 'yes'
        env:
          GH_TOKEN: ${{ github.token }}
          OUT: ${{ steps.run.outputs.out }}
          ART: ${{ steps.upload.outputs.artifact-url }}
        run: |
          # One comment, found by its first line and edited in place.
          marker='<!-- screens: side by side -->'
          { echo "$marker"; echo "### Each screen beside its mock"; echo; cat "$OUT/table.md"; echo
            echo "Mock on the left, build on the right, light above dark: ${ART:-see the run's artifacts}."
            echo "After looking, record it: sh scripts/design/screens.sh compare --mock NAME"; } > "$OUT/comment.md"
          cat "$OUT/comment.md" >> "$GITHUB_STEP_SUMMARY"
          api="repos/${{ github.repository }}/issues"
          id=$(gh api "$api/${{ github.event.pull_request.number }}/comments" --paginate --jq ".[] | select(.body | startswith(\"$marker\")) | .id" | head -n 1)
          if [ -n "$id" ]; then gh api -X PATCH "$api/comments/$id" -F "body=@$OUT/comment.md" >/dev/null
          else gh api "$api/${{ github.event.pull_request.number }}/comments" -F "body=@$OUT/comment.md" >/dev/null; fi
      - name: Say what failed
        # A summary and an annotation naming the failed step and its last
        # lines. Never cancels the run, which would mark this job cancelled
        # and hide the failure; GitHub has no call to cancel one other job.
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: sh scripts/ci/failure-report.sh job

  ci-passed:
    # The one check branch protection requires. It reports once for every
    # job. "app" or "screens" skipped on purpose counts as fine; failed or
    # cancelled does not. Never put "checks" or "app" in branch protection:
    # "app" is skipped when a change does not need it, and a required check
    # that never reports blocks the merge.
    name: CI passed
    needs: [checks, app, tests, screens]
    if: always() && github.event_name == 'pull_request'
    permissions:
      # Reads the jobs and the failed ones' annotations for the summary.
      contents: read
      actions: read
      checks: read
    runs-on: RUNS_ON
    steps:
      - uses: actions/checkout@v4
      - name: Name the failed job and its lines
        if: contains(needs.*.result, 'failure')
        env:
          GH_TOKEN: ${{ github.token }}
        run: sh scripts/ci/failure-report.sh run
      - name: Report once for every job
        env:
          PARTS: ${{ needs.checks.outputs.parts }}
        run: |
          failed=0
          parts=$(printf '%s' "${PARTS:-[]}" | tr -cd ',"' | tr -d ',' | wc -c)
          echo "test parts: $((parts / 2)) ran as one matrix"
          for pair in "checks:${{ needs.checks.result }}" "app:${{ needs.app.result }}" "tests:${{ needs.tests.result }}" "screens:${{ needs.screens.result }}"; do
            job=${pair%%:*}
            result=${pair#*:}
            echo "$job: $result"
            case "$result" in failure|cancelled) failed=1 ;; esac
          done
          [ "$failed" -eq 0 ] || { echo "A check failed; see the jobs above." >&2; exit 1; }
          echo "Every check that ran is green."

  full:
    # Main's gate, beside the "tests" matrix: what is not a test part of
    # classes.txt runs here, only when the gate decided to run.
    # On a personal account there are no runner groups and so no hosted
    # fallback: a job on self-hosted runners waits while they are offline,
    # and the nightly audit and the session brief say so. An organization can put
    # the runners in a group with a hosted fallback instead.
    # On a self-hosted Windows runner, RUN_SHELL at the top of this file is
    # Git's bash by path; a PowerShell step says
    # shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
    # (a bare "powershell" takes the machine policy, and AllSigned refuses
    # the step; not pwsh, which a Store install hides); never put an
    # expression in "shell:". Run scripts/ci/runner-doctor.sh first.
    needs: gate
    if: needs.gate.outputs.parts != '[]' && needs.gate.outputs.parts != ''
    runs-on: RUNS_ON
    steps:
      - uses: actions/checkout@v4
      - name: Run everything
        run: echo "replace with the install, the build and the full suite"

  report-red:
    needs: [full, tests]
    if: always() && github.event_name != 'pull_request' && (needs.full.result == 'failure' || needs.tests.result == 'failure')
    runs-on: RUNS_ON
    steps:
      - name: Open the red-main issue, or add this run to the open one
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          open=$(gh api "repos/${{ github.repository }}/issues?labels=ci-red&state=open&per_page=1" --jq '.[0].number // ""')
          if [ -z "$open" ]; then
            gh issue create \
              --title "main is red" \
              --label "ci-red,$( [ -f scripts/ci/lib.sh ] && . scripts/ci/lib.sh && state_label ready "$(project_label_form)" || echo state:ready )" \
              --body "Main's full gate failed on ${{ github.sha }}: $run_url. Fix it before merging anything else."
          else
            gh api "repos/${{ github.repository }}/issues/$open/comments" -f body="The gate failed again on ${{ github.sha }}: $run_url." >/dev/null
            echo "Added this run to the open red-main issue #$open."
          fi

  report-green:
    # Main went green again: close the red-main issue with a comment, so it
    # does not outlive its cause and the audit stops mentioning it.
    needs: [full, tests]
    if: always() && github.event_name != 'pull_request' && needs.full.result == 'success' && needs.tests.result == 'success'
    runs-on: RUNS_ON
    steps:
      - name: Close the red-main issue now that main is green
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          for n in $(gh issue list --label ci-red --state open --json number -q '.[].number'); do
            gh issue close "$n" --comment "Main is green again: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}. Closed by CI."
            echo "closed #$n"
          done
