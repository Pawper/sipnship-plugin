# The merge queue on a timer that does not die with a chat session. A
# drain run with /loop stops when the app closes; six green pull requests
# once sat all night for that. This runs --drain every two hours: a
# backstop, since agents drain after their own work. Every thirty minutes
# on a hosted runner was up to 1,440 billed minutes a month in a private
# repository, most of its free allowance, for runs that mostly found
# nothing to merge.
#
# Where it runs: the project's own runners, never hosted by default. In a
# private repository whose hosted minutes are used up (or whose spending
# limit is zero) a hosted job is not even started, and every scheduled run
# failed and emailed the owner. With QUEUE_RUNS_ON unset the drain runs
# on a self-hosted Windows runner (the "drain-windows" job); set the
# repository variable QUEUE_RUNS_ON to a runner's label to choose another
# (the template sync sets it from ci.yml). A label naming Windows, or no
# label, runs "drain-windows", whose shell is Git's bash by path: on a
# Windows runner a bare "bash" is the WSL stub, and a shell cannot come
# from a variable. Any other label runs "drain". Both jobs share one list
# of steps (the YAML anchor below). A drain here never holds its runner
# while it only waits: when nothing is green, or one green change is held
# for others still in CI, it says what it waits on and ends, and the next
# pull request run to finish starts it again (scripts/ci/queue/wait.sh). It
# still waits for a batch's own full run, which only it can finish.
#
# A run started by a finished check (workflow_run) is never skipped for a
# recent drain: the skip applies to the schedule only. A drain already
# running picks the pull request up at its next round, or the one queued
# behind it in the group below does.
#
# Each run drains for at most QUEUE_DRAIN_MINUTES (variable, default 25),
# holds a green pull request for a batch at most QUEUE_HOLD_MINUTES
# (variable, default 10), and skips itself when a drain finished in the
# last QUEUE_DRAIN_GAP minutes (default 10), so runs never stack and hosted
# minutes stay low: a run with nothing to merge ends in about a minute.
#
# Who the drain signs in as, best first: the queue's own GitHub App
# (secrets QUEUE_APP_ID and QUEUE_APP_KEY, made by npx sipnship
# queue-identity; a token minted at each run), else a classic token with
# "repo" as the secret QUEUE_TOKEN, else the workflow's own token. A push or
# merge by the workflow's own token starts no other workflow, so the drain
# then starts CI on the branch or main itself; a change that touches
# workflows waits for a drain run on a machine. The drain sends its picture
# to SipNShip with the run's identity token (id-token: write), no secret.
name: Queue drain

on:
  schedule:
    - cron: "7 */2 * * *"
  workflow_dispatch:
  # A pull request's CI run that finishes starts a drain at once, instead
  # of waiting for the next two-hourly one: green only, so it lands. A red
  # or cancelled pull request run starts none (the next green one does; a
  # burst of them once cancelled in the group below, each taking a runner to
  # start); a batch's run starts one whatever it ended as, since only the
  # drain finishes a batch. The job's timeout stays 60: the drain's window plus the wait for a batch's own run.
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: write
  issues: write
  pull-requests: write
  actions: write
  checks: read
  statuses: read
  id-token: write

concurrency:
  group: queue-drain
  cancel-in-progress: false

jobs:
  drain:
    if: ${{ vars.QUEUE_RUNS_ON != '' && !contains(vars.QUEUE_RUNS_ON, 'windows') && (github.event_name != 'workflow_run' || (github.event.workflow_run.event == 'pull_request' && (github.event.workflow_run.conclusion == 'success' || (startsWith(github.event.workflow_run.head_branch, 'batch-') && contains(fromJSON('["failure", "cancelled", "timed_out"]'), github.event.workflow_run.conclusion))))) }}
    runs-on: ${{ vars.QUEUE_RUNS_ON || 'self-hosted' }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash --noprofile --norc -eo pipefail {0} # "bash" written out, so the sync never takes it for a filled line
    steps: &drain-steps
      - name: Skip when a drain just ran
        id: recent
        env:
          GH_TOKEN: ${{ github.token }}
          GAP: ${{ vars.QUEUE_DRAIN_GAP || '10' }}
        run: |
          now=$(date -u +%s)
          # Paused from a session (merge-queue.sh --pause 2h), or a session's
          # own drain is working: skip, and let that one do it. A session's
          # drain counts only while its window (renewed each round) is ahead
          # AND the published state, when there is one, does not say idle:
          # a drain that died costs one window at most.
          until_epoch() { [ -n "$1" ] && date -u -d "$1" +%s 2>/dev/null || echo 0; }
          if [ "${{ github.event_name }}" = schedule ]; then
            p="${{ vars.QUEUE_PAUSED_UNTIL }}"
            if [ "$(until_epoch "$p")" -gt "$now" ]; then
              echo "Paused until $p; skipping this one."
              echo "skip=yes" >> "$GITHUB_OUTPUT"; exit 0
            fi
            l="${{ vars.QUEUE_LOCAL_DRAIN_UNTIL }}"
            if [ "$(until_epoch "$l")" -gt "$now" ]; then
              qmode=$(gh api "repos/${{ github.repository }}/issues?state=open&per_page=100" --jq '[.[] | select(.title == "Merge queue")][0].body // ""' 2>/dev/null | grep -o '"mode":"[a-z]*"' | head -n 1 || true)
              if [ "$qmode" = '"mode":"idle"' ]; then
                echo "A session's drain set its window until $l, but the queue says it is idle; draining."
              else
                echo "A session's drain is running until $l; skipping this one."
                echo "skip=yes" >> "$GITHUB_OUTPUT"; exit 0
              fi
            fi
          fi
          # Nothing open, nothing to drain: end here, in seconds, on one
          # call, instead of reading the board on a runner.
          if [ "${{ github.event_name }}" = schedule ]; then
            open_prs=$(gh api "repos/${{ github.repository }}/pulls?state=open&per_page=1" --jq 'length' 2>/dev/null || echo 1)
            if [ "$open_prs" = 0 ]; then
              echo "No pull request is open; nothing to drain."
              echo "skip=yes" >> "$GITHUB_OUTPUT"; exit 0
            fi
          fi
          last=$(gh api "repos/${{ github.repository }}/actions/workflows/queue-drain.yml/runs?status=completed&per_page=1" --jq '.workflow_runs[0].updated_at // ""' 2>/dev/null || true)
          if [ -n "$last" ] && [ "${{ github.event_name }}" = schedule ]; then
            age=$(( $(date -u +%s) - $(date -u -d "$last" +%s) ))
            if [ "$age" -lt $(( GAP * 60 )) ]; then
              echo "A drain finished $((age / 60)) minute(s) ago; skipping this one."
              echo "skip=yes" >> "$GITHUB_OUTPUT"
            fi
          fi
      - uses: actions/checkout@v4
        if: steps.recent.outputs.skip != 'yes'
        with:
          fetch-depth: 0
      # The queue's own App (npx sipnship queue-identity): its installation
      # token is minted here with openssl, so no outside action holds the key.
      # Without the App the job uses QUEUE_TOKEN, and without that, the
      # workflow's own token.
      - name: Sign in as the queue
        id: app
        if: steps.recent.outputs.skip != 'yes'
        env:
          QUEUE_APP_ID: ${{ secrets.QUEUE_APP_ID }}
          QUEUE_APP_KEY: ${{ secrets.QUEUE_APP_KEY }}
          QUEUE_TOKEN: ${{ secrets.QUEUE_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          t=$(sh scripts/ci/queue-app-token.sh) || t=""
          [ -n "$t" ] || t=$QUEUE_TOKEN
          if [ -n "$t" ]; then
            echo "::add-mask::$t"
            echo "token=$t" >> "$GITHUB_OUTPUT"
            git config --local --unset-all http.https://github.com/.extraheader || true
            git config --local http.https://github.com/.extraheader "AUTHORIZATION: basic $(printf 'x-access-token:%s' "$t" | base64 | tr -d '\n')"
          else
            echo "No queue App and no QUEUE_TOKEN: the drain lands with the workflow's own token and starts CI itself."
          fi
      # The fallback for the rules-sync workflow: when the variable RULES_OFF
      # and the switches file differ, one pull request lands them (it asks the
      # queue to land it first). It leaves the checkout as it found it.
      - name: Land any rule switch that is waiting
        if: steps.recent.outputs.skip != 'yes'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ steps.app.outputs.token || github.token }}
          GH_REPO: ${{ github.repository }}
          RULES_OFF: ${{ vars.RULES_OFF }}
        run: |
          git config user.name "merge-queue"
          git config user.email "merge-queue@users.noreply.github.com"
          if [ -f scripts/ci/rules-sync.sh ]; then sh scripts/ci/rules-sync.sh; fi
      - name: Say so when a rebuild may not run here
        if: steps.recent.outputs.skip != 'yes' && runner.environment == 'github-hosted'
        run: |
          if grep -qs '^[[:space:]]*rebuild:' scripts/ci/generated-paths.txt; then
            echo "::warning title=The rebuild runs on a hosted runner::scripts/ci/generated-paths.txt names a rebuild, and this drain runs on a hosted $RUNNER_OS runner. If the rebuild needs your machine (a JDK, Windows), set the repository variable QUEUE_RUNS_ON to that runner's label."
          fi
      - name: Drain the queue
        if: steps.recent.outputs.skip != 'yes'
        env:
          GH_TOKEN: ${{ github.token }}
          QUEUE_MERGE_TOKEN: ${{ steps.app.outputs.token }}
          QUEUE_OWN_TOKEN: ${{ steps.app.outputs.token == '' && 'yes' || 'no' }}
          GH_REPO: ${{ github.repository }}
          QUEUE_DRAIN_MINUTES: ${{ vars.QUEUE_DRAIN_MINUTES || '25' }}
          QUEUE_WAIT_MINUTES: ${{ vars.QUEUE_WAIT_MINUTES || '30' }}
          QUEUE_HOLD_MINUTES: ${{ vars.QUEUE_HOLD_MINUTES || '10' }}
          DEPLOY_INTERVAL_MINUTES: ${{ vars.DEPLOY_INTERVAL_MINUTES }}
        run: |
          git config user.name "merge-queue"
          git config user.email "merge-queue@users.noreply.github.com"
          sh scripts/ci/merge-queue.sh --drain

  drain-windows:
    if: ${{ (vars.QUEUE_RUNS_ON == '' || contains(vars.QUEUE_RUNS_ON, 'windows')) && (github.event_name != 'workflow_run' || (github.event.workflow_run.event == 'pull_request' && (github.event.workflow_run.conclusion == 'success' || (startsWith(github.event.workflow_run.head_branch, 'batch-') && contains(fromJSON('["failure", "cancelled", "timed_out"]'), github.event.workflow_run.conclusion))))) }}
    runs-on: [self-hosted, "${{ vars.QUEUE_RUNS_ON || 'windows' }}"]
    timeout-minutes: 60
    defaults:
      run:
        shell: 'C:\PROGRA~1\Git\bin\bash.exe --noprofile --norc -eo pipefail {0}'
    steps: *drain-steps
